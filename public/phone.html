<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Real Smart Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <div class="view">
      <section class="phone" id="phone" aria-label="Cloud phone">
        <canvas id="screen" width="720" height="1560" aria-label="Phone screen. Touch to control it."></canvas>
        <div class="ai-ring" aria-hidden="true"></div>
        <div class="ai-badge" id="aiBadge" hidden><span class="dot"></span><span id="aiText">AI is using the phone</span><button type="button" id="aiStop">Stop</button></div>
        <div class="connection" id="connection" role="status">Connecting to your phone…</div>
        <div class="shade" id="shade" aria-hidden="true"></div>
        <aside class="drawer" id="drawer" role="dialog" aria-label="AI" aria-hidden="true" inert>
          <div class="handle" aria-hidden="true"></div>
          <header class="drawer-head">
            <div class="tabs" role="tablist">
              <button type="button" role="tab" id="tabChat" aria-selected="true">AI</button>
              <button type="button" role="tab" id="tabSchedule" aria-selected="false">Schedules</button>
            </div>
            <button class="close" id="close" type="button" aria-label="Close">×</button>
          </header>
          <section class="pane" id="paneChat">
            <div class="messages" id="messages" role="log"></div>
            <form class="compose" id="compose">
              <input id="prompt" autocomplete="off" placeholder="Ask the AI to do something on your phone" aria-label="Ask the AI">
              <button type="submit" aria-label="Send">↑</button>
            </form>
          </section>
          <section class="pane" id="paneSchedule" hidden>
            <div class="schedules" id="schedules"></div>
            <form class="schedule-form" id="scheduleForm">
              <input id="schedPrompt" placeholder="Task (e.g. check new Instagram notifications and summarize)" aria-label="Scheduled task" required>
              <div class="schedule-row">
                <select id="schedPreset" aria-label="Repeat">
                  <option value="daily">Every day</option>
                  <option value="weekday">Weekdays</option>
                  <option value="every">Every N min</option>
                  <option value="cron">Custom (cron)</option>
                </select>
                <input id="schedTime" type="time" value="09:00" aria-label="Time">
                <input id="schedEvery" type="number" min="5" max="720" value="60" aria-label="Minutes" hidden>
                <input id="schedCron" placeholder="0 9 * * *" aria-label="cron" hidden>
                <button type="submit">Add</button>
              </div>
              <p class="schedule-note" id="schedNote">Korea time. Runs on the server even with this page closed.</p>
            </form>
          </section>
        </aside>
      </section>
    </div>
    <nav class="nav" aria-label="Phone controls">
      <button type="button" id="back" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" id="home" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
      <button type="button" id="recent" aria-label="Recent apps" title="Recent apps"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
      <button type="button" id="keys" aria-label="Keyboard" title="Type on the phone" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M6 9.5h1M9.5 9.5h1M13 9.5h1M16.5 9.5h1M6 12.5h1M9.5 12.5h1M13 12.5h1M16.5 12.5h1M8 15.5h8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
      <button type="button" id="camera" aria-label="Camera: add a photo to the phone" title="Add a photo from this device"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.3l1.4-2h5.6l1.4 2h2.3A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="12.8" r="3.3" fill="none" stroke="currentColor" stroke-width="1.9"/></svg></button>
      <button class="ai" id="ai" type="button" aria-label="AI" aria-expanded="false" aria-controls="drawer">AI</button>
    </nav>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  </main>
  <script src="cron.js"></script>
  <script src="app.js"></script>
</body>
</html>
