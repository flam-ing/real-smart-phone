<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Real Smart Phone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="seat-page">
  <main class="seat-card">
    <div class="seat-mark" aria-hidden="true"></div>
    <h1>Real Smart Phone</h1>
    <p class="seat-lead">Your own Android phone in the cloud, with an AI that can use it for you.</p>
    <form id="seatForm">
      <label for="seat">Your seat number</label>
      <input id="seat" name="seat" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="e.g. 3" required>
      <button type="submit">Open my phone</button>
      <p class="seat-error" id="error" role="alert"></p>
    </form>
    <p class="seat-note">Beta: each number is a separate phone, and its apps and photos stay. Sign-in with an account is coming later.</p>
  </main>
  <script>
    document.getElementById('seatForm').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      const res = await fetch('api/seat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ seat: document.getElementById('seat').value.trim() }) }).catch(() => null);
      if (res && res.ok) return location.reload();
      error.textContent = res ? (await res.json().catch(() => ({}))).error || 'Check the number.' : 'Could not connect. Try again.';
    });
  </script>
</body>
</html>
